services:
  bridge:
    image: nginx
    container_name: bridge
    networks:
      - management-net
      - sandbox-net
  metasploitable2:
    image: tleemcjr/metasploitable2
    container_name: metasploitable2
    networks:
      - sandbox-net
  sandbox:
    build:
      context: .
      dockerfile: Dockerfile.sandbox
    container_name: sandbox
    networks:
      - sandbox-net       

  infra:
    image: nginx
    container_name: infra
    networks:
      - management-net

  dvwa:
    image: vulnerables/web-dvwa
    container_name: dvwa
    ports:
      - "8080:80"         
    networks:
      - sandbox-net        
      - web-expose         
networks:
  management-net:
    name: management-net
    driver: bridge

  sandbox-net:
    name: sandbox-net
    driver: bridge
    internal: true         

  web-expose:
    driver: bridge      
